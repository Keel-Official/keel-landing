<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keel story prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f1a24; --ink-2: #33424e; --muted: #5f6e7a; --muted-2: #8a96a0;
    --bg: #f7f8f9; --surface: #ffffff; --surface-2: #eef1f3;
    --border: #dce1e5; --border-strong: #c6cdd3;
    --accent: #1f6f73;
    --blue: #3b82f6; --cyan: #06b6d4; --violet: #8b5cf6; --magenta: #d946ef;
    --radius: 8px; --radius-sm: 5px;
    --step: 7000ms;
    --ease: cubic-bezier(.2, .7, .2, 1);
    --spring: linear(0, .09 3%, .3 8%, .56 14%, .78 21%, .93 29%, 1.01 37%, 1.035 45%, 1.03 54%, 1.012 66%, 1.002 80%, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Manrope, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 96px 24px; }
  h2 { font-size: 32px; line-height: 1.15; letter-spacing: -0.01em; font-weight: 700; margin: 0 0 40px; text-wrap: balance; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 56px; align-items: start; }
  .stage { background: radial-gradient(110% 90% at 0% 0%, rgba(59, 130, 246, .08), transparent 60%), radial-gradient(110% 90% at 100% 100%, rgba(139, 92, 246, .08), transparent 60%), var(--surface); border: 1px solid var(--border); border-radius: var(--radius); position: sticky; top: 24px; }
  .stage svg { display: block; width: 100%; height: auto; }

  .steps { list-style: none; margin: 0; padding: 0; }
  .step { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; }
  .step:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; border-radius: var(--radius-sm); }
  .bar { height: 3px; border-radius: 2px; overflow: hidden; background: var(--border); }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), var(--cyan), var(--violet), var(--magenta)); background-size: 100vw 100%; }
  .title { display: block; font-size: 16px; font-weight: 700; line-height: 1.35; padding: 14px 0; color: var(--muted-2); transition: color .3s ease; }
  .step:hover .title { color: var(--ink-2); }
  .desc { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--ease); }
  .desc > span { overflow: hidden; min-height: 0; font-size: 15.5px; line-height: 1.6; color: var(--ink-2); opacity: 0; transition: opacity .3s ease; }
  .desc > span::after { content: ""; display: block; height: 20px; }
  .active .title { color: var(--ink); }
  .active .desc { grid-template-rows: 1fr; }
  .active .desc > span { opacity: 1; transition-delay: .15s; }
  .active .bar i { animation: fill var(--step) linear forwards; }
  @keyframes fill { to { width: 100%; } }
  .foot { margin: 28px 0 0; font: 400 11px/1.6 "JetBrains Mono", monospace; color: var(--muted); }

  /* stage drawing */
  .lbl { font: 400 11px "JetBrains Mono", monospace; fill: var(--muted); }
  .lbl.ink { fill: var(--ink); }
  .val { font: 700 13px "JetBrains Mono", monospace; fill: var(--ink); }
  .ttl { font: 700 14px Manrope, sans-serif; fill: var(--ink); }
  .grp { opacity: 0; filter: blur(5px); transition: opacity .45s ease, filter .45s ease; }
  [data-step] .grp { will-change: opacity; }
  .soft { fill: var(--border-strong); }
  .td { fill: #b4ddf0; }
  .buy { fill: url(#gCyan); }
  .sell { fill: url(#gViolet); }
  .line { stroke: var(--border); stroke-width: 1; }
  .grow { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); transition: transform .95s var(--spring); }
  .fade { --on: 0; opacity: var(--on); transform: translateY(calc((1 - var(--on)) * 6px)); filter: blur(calc((1 - var(--on)) * 3px)); transition: opacity .45s ease, transform .7s var(--spring), filter .45s ease; }

  #base { transition: opacity .35s ease; }
  #dotT { transition: transform 1.1s var(--spring); }
  #dot { fill: var(--blue); transform-box: fill-box; transform-origin: 50% 50%; transition: transform .4s var(--ease), opacity .3s ease, fill .3s ease; }
  #stem { fill: var(--blue); opacity: .55; transform-box: fill-box; transform-origin: 50% 100%; transition: transform 1.1s var(--spring), fill .3s ease; }
  #halo { fill: none; stroke: var(--magenta); stroke-width: 1.5; opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes ping { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(2.6); } }

  /* step 1 */
  [data-step="1"] #trail, [data-step="1"] #price { opacity: 1; filter: none; }
  [data-step="1"]:not(.b1) #stem { transform: scaleY(0); }
  #trail .td { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; transform: scale(0); transition: opacity .3s ease, transform .7s var(--spring); }
  .trace { fill: none; stroke: var(--blue); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .ghost { fill: none; stroke: var(--border-strong); stroke-width: 2; stroke-linecap: round; opacity: .55; }
  .js #dotT { transition: none; }
  #trail .td.on { opacity: 1; transform: scale(1); }
  [data-step="1"].b1 .s1a, [data-step="1"].b2 .s1b { --on: 1; }

  /* step 2 */
  [data-step="2"] #book, [data-step="2"] #price { opacity: 1; filter: none; }
  [data-step="2"].b1 #book .grow { transform: scaleY(1); }
  [data-step="2"].b1 #book .fade { --on: 1; }

  /* step 3 */
  [data-step="3"] #split { opacity: 1; filter: none; }
  [data-step="3"] #base { opacity: 0; }
  #split .bars rect { fill: #dde5ee; transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); transition: transform .95s var(--spring), fill .45s ease; }
  [data-step="3"] #split .bars rect { transform: scaleY(1); }
  .tick { opacity: 0; transition: transform 1s var(--spring), opacity .3s ease; }
  .tick text { opacity: 0; transition: opacity .25s ease; }
  [data-step="3"].b1 .tick { opacity: 1; transform: translateX(-51px); }
  [data-step="3"].b2 .tick { transform: translateX(-105px); }
  [data-step="3"].b3 .tick { transform: translateX(-195px); }
  [data-step="3"].b1:not(.b2) .t2, [data-step="3"].b2:not(.b3) .t5, [data-step="3"].b3 .t10 { opacity: 1; }
  [data-step="3"].b1 #split .bars .r2, [data-step="3"].b2 #split .bars .r5, [data-step="3"].b3 #split .bars .r10 { fill: var(--cyan); }
  [data-step="3"].b2 #split .fade { --on: 1; }

  /* step 4 */
  [data-step="4"] #lend, [data-step="4"] #price { opacity: 1; filter: none; }
  #lend .sold { transition: opacity .4s ease; }
  [data-step="4"].b1 #lend .sold { opacity: 0; }
  [data-step="4"].b1:not(.b4) #dotT { transform: translateY(-100px); }
  [data-step="4"].b1:not(.b4) #stem { transform: scaleY(1.763); }
  [data-step="4"].b1:not(.b4) #dot, [data-step="4"].b1:not(.b4) #stem { fill: var(--magenta); }
  #coll { fill: url(#gBlue); }
  #ghost { fill: url(#gWarn); stroke: var(--magenta); stroke-width: 1.25; stroke-dasharray: 3 3; transition: transform 1s var(--spring), opacity .4s ease; }
  [data-step="4"].b2 #ghost { transform: scaleY(1); }
  [data-step="4"].b4 #ghost { opacity: 0; }
  #cap { stroke: var(--magenta); stroke-width: 2; stroke-linecap: round; }
  [data-step="4"].b2:not(.b4) #cap { --on: 1; }
  [data-step="4"].b1:not(.b4) #halo, [data-step="5"].hot #halo { animation: ping 1s ease-out 1; }
  #loan { fill: rgba(217, 70, 239, .10); stroke: var(--magenta); stroke-width: 1.5; }
  [data-step="4"].b3 #loan { transform: scaleY(1); }
  [data-step="4"].b3 .s4 { --on: 1; }

  /* step 5 */
  [data-step="5"] #ladder, [data-step="5"] #price { opacity: 1; filter: none; }
  [data-step="5"] #stem { transform: scaleY(0); }
  #lim1 { fill: url(#gCyan); }
  #ladder .rl { transition: fill .3s ease; }
  #ladder .rl.on { fill: var(--ink); font-weight: 700; }

  /* step 6 */
  [data-step="6"] #limits { opacity: 1; filter: none; }
  [data-step="6"].b1 #lim1, [data-step="6"].b2 #lim2 { transform: scaleY(1); }
  #lim2 { fill: url(#gViolet); }
  #safe { stroke: var(--blue); stroke-width: 1.5; stroke-dasharray: 4 4; stroke-dashoffset: 0; }
  [data-step="6"].b3 .s6 { --on: 1; }

  @media (max-width: 880px) {
    .wrap { padding: 56px 20px; }
    h2 { font-size: 26px; margin-bottom: 28px; }
    .grid { grid-template-columns: 1fr; gap: 28px; }
    .stage { position: static; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    .active .bar i { width: 100%; }
  }
</style>
</head>
<body>
<main class="wrap">
  <h2>Price is not liquidity</h2>
  <div class="grid">
    <div class="stage" id="stage" data-step="1" aria-hidden="true">
      <svg viewBox="0 36 560 352" id="svg"></svg>
    </div>
    <ol class="steps" id="steps"></ol>
  </div>
  <p class="foot">Prototype for motion review. Step 3 figures are the ones on the current landing page. Bar shapes are illustrative, not scaled from data.</p>
</main>

<script>
const COPY = [
  ["A price is only the last trade.", "It tells you what someone just paid. It does not tell you what the next seller will get."],
  ["What matters is what stands behind it.", "Behind every price on Stellar are open offers to buy and sell, in the order book and in liquidity pools. The more of them there are, the harder the price is to move."],
  ["Some markets are a slope. Some are a cliff.", "USTRY can absorb 260,649.22 USDC of selling before its price drops 5%. XLM can absorb 91,490.48 USDC."],
  ["Lending apps trust the price.", "A lending app values your collateral at the price it sees. If that price is cheap to push up, someone can borrow far more than their collateral is really worth."],
  ["It happened on Stellar.", "On 22 February 2026, USTRY, a thinly traded token, was pushed to roughly 100 times its price and used as collateral on Blend."],
  ["Keel measures the market behind the price.", "Every 15 minutes, Keel reads Stellar's order books and liquidity pools and works out two limits. The selling limit: how much collateral the market can absorb in a forced sale. The manipulation limit: the point where pushing the price up costs less than the loan it would unlock. The lower of the two is the safe collateral size."]
];
const BEATS = {
  1: [[2850, "b1"], [3900, "b2"]],
  2: [[350, "b1"]],
  3: [[900, "b1"], [2400, "b2"], [4000, "b3"]],
  4: [[800, "b1"], [2000, "b2"], [3100, "b3"], [4700, "b4"]],
  5: [],
  6: [[400, "b1"], [1000, "b2"], [2300, "b3"]]
};
const ALL = ["b1", "b2", "b3", "b4"];
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* build the stage */
const H = [22, 36, 52, 68, 84, 98, 112, 124];
const BASE = 310;
let s = "";
s += `<defs>
  <linearGradient id="gCyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#a5e8f3"/></linearGradient>
  <linearGradient id="gViolet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#d4c5fc"/></linearGradient>
  <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#a9c9fc"/></linearGradient>
  <linearGradient id="gWarn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d946ef" stop-opacity=".26"/><stop offset="1" stop-color="#8b5cf6" stop-opacity=".14"/></linearGradient>
  <linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="280" y2="0"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
  <linearGradient id="g5" gradientUnits="userSpaceOnUse" x1="110" y1="0" x2="450" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset=".45" stop-color="#3b82f6"/><stop offset=".62" stop-color="#6d6af8"/><stop offset=".78" stop-color="#8b5cf6"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
</defs>`;
s += `<line id="base" class="line" x1="60" y1="${BASE}" x2="500" y2="${BASE}"/>`;

/* step 1: trail of earlier trades */
const trailY = [205, 222, 190, 214, 180, 208, 196];
s += `<g id="trail" class="grp">`;
const P1 = trailY.map((y, i) => [70 + i * 30, y]).concat([[280, 170]]);
function smooth(pts) {
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}
s += `<path id="p1" class="trace" pathLength="1" style="stroke:url(#g1)" d="${smooth(P1)}"/>`;
trailY.forEach((y, i) => { s += `<circle class="soft td" cx="${70 + i * 30}" cy="${y}" r="4"/>`; });
s += `<line class="fade s1b" x1="294" y1="170" x2="352" y2="170" stroke="#8a96a0" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round"/>`;
s += `<text class="lbl ink fade s1a" x="280" y="334" text-anchor="middle">Last trade</text>`;
s += `<circle class="fade s1b" cx="364" cy="170" r="9" fill="none" stroke="#8a96a0" stroke-width="1.5" stroke-dasharray="3 3"/>`;
s += `<text class="lbl fade s1b" x="364" y="334" text-anchor="middle">Next trade</text></g>`;

/* step 2: offers stack up behind the price */
s += `<g id="book" class="grp">`;
H.forEach((h, i) => {
  s += `<rect class="buy grow" x="${252 - i * 20}" y="${BASE - h}" width="14" height="${h}" rx="3" style="transition-delay:${i * 45}ms"/>`;
  s += `<rect class="sell grow" x="${294 + i * 20}" y="${BASE - h}" width="14" height="${h}" rx="3" style="transition-delay:${i * 45}ms"/>`;
});
s += `<text class="lbl fade" x="182" y="334" text-anchor="middle">Offers to buy</text>`;
s += `<text class="lbl ink fade" x="280" y="334" text-anchor="middle">Price</text>`;
s += `<text class="lbl fade" x="378" y="334" text-anchor="middle">Offers to sell</text></g>`;

/* step 3: two markets, range widens 2% -> 5% -> 10% */
function market(x0, dotX, name, heights, value) {
  let m = `<text class="ttl" x="${x0}" y="64">${name}</text>`;
  m += `<line class="line" x1="${x0}" y1="250" x2="${dotX + 12}" y2="250"/>`;
  m += `<g class="bars">`;
  heights.forEach((h, i) => {
    const cls = i < 2 ? "r2 r5 r10" : i < 5 ? "r5 r10" : "r10";
    m += `<rect class="${cls}" x="${dotX - 30 - i * 18}" y="${250 - h}" width="12" height="${h}" rx="${Math.min(3, h / 2)}" style="transition-delay:${i * 40}ms"/>`;
  });
  m += `</g>`;
  m += `<rect x="${dotX - .75}" y="137" width="1.5" height="113" fill="#3b82f6" opacity=".55"/><circle cx="${dotX}" cy="130" r="7" fill="#3b82f6"/>`;
  m += `<g class="tick"><line x1="${dotX}" y1="108" x2="${dotX}" y2="250" stroke="#3b82f6" stroke-width="1.5"/>`;
  m += `<text class="lbl ink t2" x="${dotX}" y="100" text-anchor="middle">2%</text><text class="lbl ink t5" x="${dotX}" y="100" text-anchor="middle">5%</text><text class="lbl ink t10" x="${dotX}" y="100" text-anchor="middle">10%</text></g>`;
  [...value].forEach((ch, i) => { if (ch !== " ") m += `<text class="val fade" x="${x0 + i * 7.8}" y="282" style="transition-delay:${i * 28}ms">${ch}</text>`; });
  m += `<text class="lbl fade" x="${x0}" y="300" style="transition-delay:${value.length * 28}ms">at 5%</text>`;
  return m;
}
s += `<g id="split" class="grp">`;
s += market(40, 250, "USTRY / USDC", [34, 42, 50, 58, 64, 70, 76, 82, 88, 92], "260,649.22 USDC");
s += market(300, 510, "XLM / USDC", [36, 46, 52, 5, 4, 4, 3, 3, 2, 2], "91,490.48 USDC");
s += `</g>`;

/* step 4: price pushed up, collateral inflates, loan goes out, price falls back */
s += `<g id="lend" class="grp">`;
H.forEach((h, i) => { s += `<rect class="buy" x="${252 - i * 20}" y="${BASE - h}" width="14" height="${h}" rx="3"/>`; });
[10, 14, 18].forEach((h, i) => { s += `<rect class="sell sold" x="${294 + i * 20}" y="${BASE - h}" width="14" height="${h}" rx="3" style="transition-delay:${i * 90}ms"/>`; });
s += `<rect id="ghost" class="grow" x="384" y="140" width="40" height="170" rx="4"/>`;
s += `<line id="cap" class="fade" x1="378" y1="140" x2="430" y2="140"/>`;
s += `<rect id="coll" x="384" y="260" width="40" height="50" rx="4"/>`;
s += `<rect id="loan" class="grow" x="470" y="180" width="40" height="130" rx="4"/>`;
s += `<text class="lbl" x="404" y="334" text-anchor="middle">Collateral value</text>`;
s += `<text class="lbl fade s4" x="490" y="334" text-anchor="middle">Loan</text></g>`;

/* step 5: the climb to 100x */
s += `<g id="ladder" class="grp">`;
[[310, "1×", "r1"], [230, "10×", "r10l"], [150, "100×", "r100l"]].forEach(([y, t, id]) => {
  s += `<line class="line" x1="110" y1="${y}" x2="470" y2="${y}" stroke-dasharray="${y === 310 ? "none" : "2 5"}"/><text id="${id}" class="lbl rl" x="90" y="${y + 4}" text-anchor="end">${t}</text>`;
});
const D5 = "M110,310 L250,310 C300,310 318,300 335,255 C352,205 372,150 450,150";
s += `<path class="ghost" d="${D5}"/><path id="p5" class="trace" pathLength="1" stroke="url(#g5)" style="stroke:url(#g5)" d="${D5}"/>`;
s += `<text class="lbl" x="110" y="64">22 February 2026</text></g>`;

/* step 6: two limits, the lower one marked */
s += `<g id="limits" class="grp">`;
s += `<rect id="lim1" class="grow" x="170" y="120" width="70" height="190" rx="5"/>`;
s += `<rect id="lim2" class="grow" x="320" y="200" width="70" height="110" rx="5"/>`;
s += `<line id="safe" class="fade s6" x1="150" y1="200" x2="410" y2="200"/>`;
s += `<text class="lbl ink fade s6" x="355" y="188" text-anchor="middle">Safe collateral size</text>`;
s += `<text class="lbl" x="205" y="334" text-anchor="middle">Selling limit</text>`;
s += `<text class="lbl" x="355" y="334" text-anchor="middle">Manipulation limit</text>`;
s += `<text class="lbl" x="280" y="372" text-anchor="middle">Illustration, not data.</text></g>`;

/* the persistent price dot */
s += `<g id="price" class="grp"><rect id="stem" x="279.25" y="179" width="1.5" height="131"/><g id="dotT"><circle id="halo" cx="280" cy="170" r="9"/><circle id="dot" cx="280" cy="170" r="9"/></g></g>`;
document.getElementById("svg").innerHTML = s;

/* build the step list */
const list = document.getElementById("steps");
COPY.forEach(([t, d], i) => {
  const li = document.createElement("li");
  li.innerHTML = `<button class="step" type="button" aria-expanded="false"><span class="bar"><i></i></span><span class="title">${t}</span><span class="desc"><span>${d}</span></span></button>`;
  li.firstChild.addEventListener("click", () => go(i + 1));
  li.firstChild.querySelector("i").addEventListener("animationend", () => go(i === COPY.length - 1 ? 1 : i + 2));
  list.appendChild(li);
});

const stage = document.getElementById("stage");
const dotT = document.getElementById("dotT"), p1 = document.getElementById("p1"), p5 = document.getElementById("p5");
const tds = [...document.querySelectorAll("#trail .td")], rl = ["r1", "r10l", "r100l"].map(id => document.getElementById(id));
const HOME = [280, 170];
const dot = document.getElementById("dot");
let timers = [], raf = 0;
const at = (pt) => `translate(${(pt.x - HOME[0]).toFixed(2)}px, ${(pt.y - HOME[1]).toFixed(2)}px)`;
const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function frame(path, q, onP) {
  const pt = path.getPointAtLength(q * path.getTotalLength());
  path.style.strokeDashoffset = 1 - q;
  dotT.style.transform = at(pt);
  if (onP) onP(q, pt);
}
function travel(path, dur, onP, done) {
  const t0 = performance.now();
  const tick = (now) => {
    const p = Math.min(1, (now - t0) / dur);
    frame(path, ease(p), onP);
    if (p < 1) raf = requestAnimationFrame(tick); else if (done) done();
  };
  raf = requestAnimationFrame(tick);
}
const on1 = (q) => tds.forEach((c, i) => c.classList.toggle("on", q >= i / 7 - .001));
const on5 = (q, pt) => {
  stage.classList.toggle("hot", pt.y < 300);
  dot.style.fill = pt.y > 300 ? "" : pt.y > 231 ? "#6d6af8" : pt.y > 152 ? "#8b5cf6" : "#d946ef";
  rl[0].classList.toggle("on", q > 0);
